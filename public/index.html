<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee CRUD</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

<div class="container">

    <h2>Employee Management</h2>

    <div id="loader" class="loader" style="display:none;">
        Loading...
    </div>

    <form id="empForm">

        <input type="hidden" id="id">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
            required
        >

        <input
            type="text"
            id="mobile"
            placeholder="Mobile"
            required
        >

        <input
            type="text"
            id="city"
            placeholder="City"
            required
        >

        <input
            type="text"
            id="department"
            placeholder="Department"
            required
        >

        <input
            type="number"
            id="salary"
            placeholder="Salary"
            required
        >

        <button type="submit">Save</button>

    </form>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Mobile</th>
                <th>City</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tbody"></tbody>

    </table>

</div>

<script src="app.js"></script>

</body>
</html>
